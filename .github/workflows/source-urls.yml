name: 出典URLの死活（週1・手動）

# ★通常のCI(ci.yml)には入れない。理由:
#   ・外部の官公庁サイトに毎回13本叩くと、向こうの都合(メンテ・混雑・レート制限)でCIが赤くなる。
#     それは「うちのコードが壊れた」ではないのに push が止まり、業務が止まる。
#   ・自分のせいでない理由で赤が出ると、人は赤を無視するようになる。それが一番まずい
#     （本物の赤も見なくなる）。
#   だから【別ワークフロー】で週1＋手動。落ちても push は止まらない。
#   見つかった404は実行ログに一覧で出る＝指示役が見て中央 statutory を直す。
#   ★この道具は読むだけ（anon GET）。中央へ書く経路は無い。
#
# ★誰が見るか（docs/SPEC_engine_grid_contract_v0.md §12.2）
#   落ちたらその週のうちに実装セッションが気づき、★次の報告に必ず
#   「出典URL 生きているN／死んでいるM」の1行を載せる★。
#   誰も見ない週1は、無いのと同じ。落ちていない週も数字を出すのは、
#   ワークフロー自体が止まっていることに気づくため。

# ★★ここは 本番 rakunally（請求書だけ）★★ … 元は rakually-test の CI をそのまま運んだ物。
#   scripts/ship-seikyu.mjs が ★運び先に無いファイルを指すステップだけ★ 外して作る。
#   ★外した理由は1つだけ＝給与の画面(kyuyo/)を運んでいないから★（機能を削った訳ではない）。
#   ★戻す条件★: 本番にも給与を出す日（＝10月の改名・URL切替の塊）。その時 一緒に戻す。
#   ★手で消さない★＝ここを直す時は rakually-test 側を直して 運び直す。
#   ★外したステップ 3本★
#     ・★中央statutoryの出典URLが全部生きているか（404なら赤・ただしCIは止めない）  ( kyuyo/scripts/check-source-urls.mjs )
#     ・★賃金要件(88,000円)の撤廃が法令に入ったか（入っていたら赤＝切替の合図）  ( kyuyo/scripts/check-wage88k-removal.mjs )
#     ・★最低賃金の年度が進んだか（進んでいたら赤＝入れ替えの合図）  ( kyuyo/scripts/check-saitei-nendo.mjs )
on:
  schedule:
    - cron: '0 0 * * 1'      # 毎週月曜 00:00 UTC = 日本時間 月曜9時
  workflow_dispatch:          # 手動でも回せる

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
